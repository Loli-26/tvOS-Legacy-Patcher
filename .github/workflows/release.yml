cd ~/tvOS-Legacy-Patcher
rm -rf .github/workflows/*
mkdir -p .github/workflows

printf '%s\n' \
'name: Release' \
'on: push' \
'jobs:' \
'  release:' \
'    runs-on: ubuntu-latest' \
'    permissions:' \
'      contents: write' \
'    steps:' \
'      - uses: actions/checkout@v4' \
'      - run: |' \
'          chmod +x *.sh' \
'          bash -n tvlp.sh' \
'          bash -n build_ipsw.sh' \
'          bash -n qemu_boot.sh' \
'          bash -n deploy_tvos.sh' \
'          zip -r tvOS-Legacy-Patcher-macOS15-Intel.zip tvlp.sh build_ipsw.sh qemu_boot.sh deploy_tvos.sh profiles README.md CHANGELOG.md' \
'      - uses: softprops/action-gh-release@v2' \
'        with:' \
'          tag_name: v1.0.0' \
'          name: tvOS Legacy Patcher v1.0.0' \
'          files: tvOS-Legacy-Patcher-macOS15-Intel.zip' \
'          body_path: CHANGELOG.md' > .github/workflows/release.yml

nl -ba .github/workflows/release.yml
git add -A .github/workflows
git commit -m "CI: fast zero-error release workflow"
git push origin main
