cd ~/tvOS-Legacy-Patcher
rm -rf .github/workflows/*

ruby -e '
content = <<~YAML
  name: Build and Publish tvLP Release
  on:
    push:
      branches:
        - main
    workflow_dispatch:
  jobs:
    package-release-intel:
      name: Build on macOS 15 Intel
      runs-on: macos-15-intel
      permissions:
        contents: write
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Verify Intel macOS 15 Runner
          run: |
            uname -m
            sw_vers
        - name: Validate Scripts
          run: |
            chmod +x tvlp.sh build_ipsw.sh qemu_boot.sh deploy_tvos.sh
            bash -n tvlp.sh
            bash -n build_ipsw.sh
            bash -n qemu_boot.sh
            bash -n deploy_tvos.sh
        - name: Package Release Archive
          run: |
            mkdir -p dist
            zip -r dist/tvOS-Legacy-Patcher-macOS15-Intel.zip tvlp.sh build_ipsw.sh qemu_boot.sh deploy_tvos.sh profiles README.md CHANGELOG.md
        - name: Publish GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v1.0.0
            name: tvOS Legacy Patcher v1.0.0
            files: dist/tvOS-Legacy-Patcher-macOS15-Intel.zip
            body_path: CHANGELOG.md
YAML
File.write(".github/workflows/release.yml", content)
'

nl -ba .github/workflows/release.yml
git add -A .github/workflows
git commit -m "CI: move permissions inside job block to fix line 7"
git push origin main
