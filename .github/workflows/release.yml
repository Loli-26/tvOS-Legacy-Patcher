cd ~/tvOS-Legacy-Patcher
rm -rf .github/workflows/*
mkdir -p .github/workflows

printf '%s\n' \
'name: Release' \
'on: push' \
'permissions:' \
'  contents: write' \
'jobs:' \
'  build:' \
'    runs-on: ubuntu-latest' \
'    steps:' \
'      - uses: actions/checkout@v4' \
'      - name: Package Release' \
'        run: |' \
'          chmod +x *.sh 2>/dev/null || true' \
'          zip -r tvOS-Legacy-Patcher-macOS15-Intel.zip . -x "*.git*" "*.zip"' \
'      - name: Publish Release' \
'        env:' \
'          GH_TOKEN: ${{ github.token }}' \
'        run: |' \
'          gh release delete v1.0.0 --yes 2>/dev/null || true' \
'          gh release create v1.0.0 tvOS-Legacy-Patcher-macOS15-Intel.zip --title "tvOS Legacy Patcher v1.0.0" --notes "All-in-one jailbreak-free release for Apple TV HD (A8) and Apple TV 4K 1st Gen (A10X)."' > .github/workflows/release.yml

git add -A
git commit -m "CI: self-healing zero-error release workflow"
git push origin main
