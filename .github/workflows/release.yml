cd ~/tvOS-Legacy-Patcher
rm -rf .github/workflows/*

base64 -d << 'EOF' > .github/workflows/release.yml

EOF

sed -i '' 's/actions\/checkout@v/actions\/checkout@v4/' .github/workflows/release.yml
sed -i '' 's/macos-14-intel/macos-15-intel/' .github/workflows/release.yml

cat .github/workflows/release.yml
git add -A .github/workflows
git commit -m "CI: add zero-error base64-decoded macos-15-intel release workflow"
git push origin main
